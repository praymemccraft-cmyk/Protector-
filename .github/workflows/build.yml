name: Build APK from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip project
      run: |
        unzip SafeGuardMobile.zip -d extracted_project

    - name: Grant execute permission for gradlew
      run: chmod +x extracted_project/gradlew

    - name: Build APK
      run: |
        cd extracted_project
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
        
